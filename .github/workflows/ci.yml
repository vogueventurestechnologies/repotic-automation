name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run verification test suite
        run: |
          python -m pytest tests/test_all.py -v

      - name: Test CLI pipeline execution
        run: |
          python repotic_to_final.py tests/fixtures/repotic_sample.xlsx tests/fixtures/ledger_sample.xlsx tests/fixtures/template_sample.xlsx output/Final_Output_Tamilnadu.xlsx --month 2026-08

      - name: Upload generated Excel artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: Final_Output_Tamilnadu
          path: output/Final_Output_Tamilnadu.xlsx
          retention-days: 7

